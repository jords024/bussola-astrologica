server {
    listen 80;
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Ocultar versao do Nginx por seguranca
    server_tokens off;

    # Compressao Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Cabecalhos de seguranca
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache para imagens e assets de midia
    location ~* \.(webp|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Cache curto para scripts e estilos
    location ~* \.(css|js)$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }

    # Roteamento padrao (SPA / Static)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Rota amigavel para a pagina de obrigado
    location = /obrigado {
        try_files /obrigado.html =404;
    }

    # Healthcheck para Traefik / Docker Swarm
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }
}
