services:
  # ============================================================================
  # Serviço da Aplicação Web (Landing Page & Painel Astrowake / Bússola)
  # ============================================================================
  landing_crassus:
    image: aryalvesfernandes/landing-crassus:1.2.5
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    
    networks:
      - network_swarm_public

    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      
      ##########################################
      # Configurações do Banco de Dados Postgres
      ##########################################
      - DATABASE_URL=postgres://postgres:mo46ijCkMEm6xTMLGaVy_AGYgVELbiz_x540emXgUwQ@postgres:5432/bussola_astrologica
      
      ##########################################
      # Chave de Segurança JWT
      ##########################################
      - JWT_SECRET=239e9d56-3452-4eee-a897-703a34cc56e0

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M
      labels:
        # Habilita o Traefik
        - traefik.enable=true
        
        # Define a rede do Swarm para o Traefik
        - traefik.docker.network=network_swarm_public
        
        # Configura o Domínio / Roteamento HTTP(S)
        - traefik.http.routers.landing_crassus.rule=Host(`pgbussola.crassusastrologo.com.br`)
        
        # Define o ponto de entrada HTTPS e Certificado SSL Let's Encrypt
        - traefik.http.routers.landing_crassus.entrypoints=websecure
        - traefik.http.routers.landing_crassus.tls.certresolver=letsencryptresolver
        
        # Define o serviço do Traefik e Porta interna
        - traefik.http.routers.landing_crassus.service=landing_crassus
        - traefik.http.services.landing_crassus.loadbalancer.server.port=3000
        - traefik.http.services.landing_crassus.loadbalancer.passHostHeader=true

        # Configura o Middleware para Headers SSL / HTTPS
        - traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto=https
        - traefik.http.routers.landing_crassus.middlewares=sslheader@docker

  # ============================================================================
  # Serviço do Quiz Astrológico (FastAPI, Cálculos Kerykeion & Leitura IA)
  # ============================================================================
  quiz_crassus:
    image: aryalvesfernandes/quiz-crassus:1.2.5
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"

    networks:
      - network_swarm_public

    volumes:
      - quiz_dados:/app/dados

    environment:
      # Diretório gravável dentro do container para armazenar dados e cache
      - DIR_DADOS=/app/dados

      # Chave da API OpenAI para geração da carta personalizada
      - OPENAI_API_KEY=

      # Modelo utilizado para redação da carta astrológica
      - MODELO_LEITURA=gpt-5.6-luna

      # Credenciais de acesso ao painel de métricas (/painel)
      - PAINEL_USUARIO=crassus
      - PAINEL_SENHA=bussola_painel_senha_segura_2026

      # Política de retenção de dados (dias)
      - EVENTOS_RETENCAO_DIAS=180
      - LEITURAS_RETENCAO_DIAS=180

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M
      labels:
        # Habilita o Traefik
        - traefik.enable=true

        # Define a rede do Swarm para o Traefik
        - traefik.docker.network=network_swarm_public

        # Configura o Domínio / Roteamento HTTP(S) do Quiz
        - traefik.http.routers.quiz_crassus.rule=Host(`crassusastrologo.com.br`)

        # Ponto de entrada HTTPS e Certificado SSL Let's Encrypt
        - traefik.http.routers.quiz_crassus.entrypoints=websecure
        - traefik.http.routers.quiz_crassus.tls.certresolver=letsencryptresolver

        # Define o serviço do Traefik e Porta interna
        - traefik.http.routers.quiz_crassus.service=quiz_crassus
        - traefik.http.services.quiz_crassus.loadbalancer.server.port=8765
        - traefik.http.services.quiz_crassus.loadbalancer.passHostHeader=true

        # Configura o Middleware para Headers SSL / HTTPS
        - traefik.http.routers.quiz_crassus.middlewares=sslheader@docker

# ==============================================================================
# Definição dos Volumes do Stack
# ==============================================================================
volumes:
  quiz_dados:
    external: true
    name: quiz_dados

# ==============================================================================
# Definição das Redes do Stack
# ==============================================================================
networks:
  network_swarm_public:
    external: true
    name: network_swarm_public
